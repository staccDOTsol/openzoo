app = "openzoo-grokbot"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENZOO_NO_TUNNEL = "1"
  OZ_GROKBOT_WEB_PORT = "4174"
  OZ_GROKBOT_WEB_BIND = "0.0.0.0"
  OPENZOO_BIND = "0.0.0.0"
  GROK_BOT_ASAR = "/app/asar/app.asar"
  HOME = "/data"

[http_service]
  internal_port = 4174
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "90s"
    method = "GET"
    path = "/oz-health"

[[vm]]
  size = "performance-16x"
  memory = "32gb"

[[mounts]]
  source = "grokbot_data"
  destination = "/data"

[[restart]]
  policy = "always"
  retries = 10
