# Build the openzoo box image and push it to Docker Hub.
#
# Triggers on any grokui-v* / v* tag, so cutting a release publishes the image
# with no further action. Also runnable by hand with an explicit tag to
# reproduce an older image.
#
# The image bakes code-server + Cline (saoudrizwan.claude-dev) + openzoo + a
# dev toolchain onto disk so a box never fetches from GitHub at boot: RunPod
# egress IPs get 429'd, and a 429 from raw.githubusercontent lands as a file
# whose CONTENTS are the text "429: Too Many Requests", which then fails like
# an app bug rather than a download bug.
#
# Product on :8080 is a mobile-first Cline Agent (password auth, never --auth
# none). Cline is pointed at https://x402-tokens.fly.dev/v1. grokui is not
# the box UI. Still triggers on grokui-v* / v* tags.
#
# BUILT ON GITHUB'S OWN NATIVE RUNNERS — `ubuntu-latest` (amd64) and
# `ubuntu-24.04-arm` (real arm64 hardware, free on public repos). We ran OUT OF
# DOCKER BUILD CLOUD MINUTES, so the `driver: cloud` shape is gone; this is the
# two-runner matrix it replaced, restored.
#
# WHY PUSH-BY-DIGEST + A MERGE JOB: two runners cannot both write the same tag
# without clobbering each other's manifest — whoever pushes last wins and the
# image silently becomes single-arch. So each leg pushes an untagged blob and
# reports its digest, and `merge` stitches them into one multi-arch manifest.
# That machinery is the price of the matrix; it is not optional.
#
# NO setup-qemu-action. Both arches are native here. Emulation is what made the
# original single job ~7m30s, and that action was also the flakiest step in this
# file (codeload 503'd on it three times in one incident, failing the run before
# anything was built).
#
# History, so nobody reintroduces a slower shape: single-job QEMU ~7m30s, this
# native matrix ~2m50s, Build Cloud cold ~4m05s / warm ~1m09s. Build Cloud was
# fastest when warm and is the thing to go back to if minutes are topped up —
# the only edit needed is restoring `driver: cloud` and collapsing to one job.
name: docker-box

on:
  push:
    tags: ['grokui-v*', 'v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'openzoo tag to bake (blank = newest grokui-v*)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag being baked
        id: oz
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then TAG=latest; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "baking $TAG for ${{ matrix.platform }}"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Plain docker-container driver on the runner itself. Native, no cloud
      # endpoint, no emulation.
      - uses: docker/setup-buildx-action@v3

      # amd64 only, --load'ed, so the gate can actually RUN the image. A
      # multi-arch result is a manifest and cannot be loaded into the local
      # docker. The push below reuses this layer cache, so it is close to free.
      - name: Build (for smoke test)
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: box.Dockerfile
          build-args: |
            OZ_TAG=${{ steps.oz.outputs.tag }}
          platforms: linux/amd64
          load: true
          tags: openzoo-box:smoke
          cache-from: type=gha,scope=box-amd64
          cache-to: type=gha,scope=box-amd64,mode=max

      # The gate. A 429 corpse, a missing bin, a musl base, a UI that does not
      # serve, or a missing dev toolchain fails HERE and nothing is published.
      - name: Smoke test
        if: matrix.arch == 'amd64'
        run: |
          set -eu
          docker run --rm openzoo-box:smoke cat /etc/os-release | grep -qi debian \
            || { echo 'FAIL: base is not Debian'; exit 1; }
          docker run --rm openzoo-box:smoke test -f /opt/openzoo/bin/openzoo.js \
            || { echo 'FAIL: /opt/openzoo/bin/openzoo.js missing'; exit 1; }
          docker run --rm openzoo-box:smoke test -d /opt/openzoo/node_modules \
            || { echo 'FAIL: /opt/openzoo/node_modules missing'; exit 1; }
          docker run --rm openzoo-box:smoke sh -c 'command -v code-server' \
            || { echo 'FAIL: code-server missing from the image'; exit 1; }
          docker run --rm openzoo-box:smoke sh -c 'ls -d /opt/code-server/extensions/saoudrizwan.claude-dev*' \
            || { echo 'FAIL: Cline extension saoudrizwan.claude-dev missing'; exit 1; }
          docker run --rm openzoo-box:smoke test -f /opt/code-server/cline-config-keys.json \
            || { echo 'FAIL: /opt/code-server/cline-config-keys.json missing'; exit 1; }
          docker run --rm openzoo-box:smoke test -f /opt/code-server/mobile.css \
            || { echo 'FAIL: mobile.css missing'; exit 1; }
          docker run --rm openzoo-box:smoke test -f /opt/code-server/extensions/openzoo.box-mobile-1.0.0/extension.js \
            || { echo 'FAIL: openzoo.box-mobile extension missing'; exit 1; }
          docker run --rm openzoo-box:smoke sh -c 'printenv ANTHROPIC_API_KEY' \
            && { echo 'FAIL: ANTHROPIC_API_KEY is set in the image'; exit 1; } || true
          # The dev toolchain is the point of the image; without it a bot hits
          # `python3: not found` and looks broken when the box is at fault.
          for b in bash gcc make python3 pip3 git jq rg code-server; do
            docker run --rm openzoo-box:smoke sh -c "command -v $b >/dev/null" \
              || { echo "FAIL: $b missing from the image"; exit 1; }
          done
          echo "baked tag: $(docker run --rm openzoo-box:smoke cat /opt/openzoo/.oz-tag)"

          docker run --rm -d --name ozbox -p 8080:8080 \
            -e OPENZOO_IDE_PASSWORD=smokepass \
            -e OPENZOO_SUB_KEY=oz_smoke_test_key \
            -e OPENZOO_BOX_SIDECAR=0 \
            openzoo-box:smoke
          ok=0
          for i in $(seq 1 60); do
            if docker logs ozbox 2>&1 | grep -qE '--auth none'; then
              echo '--- container logs ---'; docker logs ozbox 2>&1 | tail -40
              echo 'FAIL: code-server started with --auth none'; docker rm -f ozbox; exit 1
            fi
            if curl -fsS -o /tmp/health.json http://127.0.0.1:8080/health; then ok=1; break; fi
            sleep 1
          done
          echo '--- container logs ---'; docker logs ozbox 2>&1 | tail -30
          [ "$ok" = 1 ] || { echo 'FAIL: GET /health on :8080 never 200'; docker rm -f ozbox; exit 1; }
          grep -q '"ok":true' /tmp/health.json \
            || { echo 'FAIL: /health body:'; cat /tmp/health.json; docker rm -f ozbox; exit 1; }
          docker exec ozbox sh -c 'test -z "${ANTHROPIC_API_KEY:-}"' \
            || { echo 'FAIL: ANTHROPIC_API_KEY is set at runtime'; docker rm -f ozbox; exit 1; }
          docker exec ozbox grep -q 'auth: password' /root/.config/code-server/config.yaml \
            || { echo 'FAIL: code-server auth is not password'; docker rm -f ozbox; exit 1; }
          docker exec ozbox grep -qE 'auth:[[:space:]]*none' /root/.config/code-server/config.yaml \
            && { echo 'FAIL: auth none in config.yaml'; docker rm -f ozbox; exit 1; } || true
          docker exec ozbox grep -q 'x402-tokens.fly.dev/v1' /root/.cline/data/globalState.json \
            || { echo 'FAIL: Cline globalState missing OpenZoo gateway'; docker rm -f ozbox; exit 1; }
          docker exec ozbox grep -q 'workbench.activityBar.location' /root/.local/share/code-server/User/settings.json \
            || { echo 'FAIL: activity bar not hidden in User settings'; docker rm -f ozbox; exit 1; }
          docker exec ozbox grep -q 'width=device-width' /opt/code-server/mobile.js \
            || { echo 'FAIL: mobile.js missing device-width viewport'; docker rm -f ozbox; exit 1; }
          docker exec ozbox grep -q 'oz_smoke_test_key' /root/.cline/data/secrets.json \
            || { echo 'FAIL: Cline secrets missing subscription key'; docker rm -f ozbox; exit 1; }
          docker exec ozbox grep -q api.anthropic.com /root/.cline/data/globalState.json \
            && { echo 'FAIL: Cline pointed at api.anthropic.com'; docker rm -f ozbox; exit 1; } || true
          echo 'OK: code-server /health 200, Cline preconfigured, mobile-first, auth=password, ANTHROPIC_API_KEY unset'
          docker rm -f ozbox

      # UNTAGGED, by digest. Everything lands in openzoo-box; `merge` creates
      # every tag, in both repos, from these digests.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: box.Dockerfile
          build-args: |
            OZ_TAG=${{ steps.oz.outputs.tag }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=box-${{ matrix.arch }}
          cache-to: type=gha,scope=box-${{ matrix.arch }},mode=max
          outputs: type=image,name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/openzoo-box,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -eu
          mkdir -p /tmp/digests
          # ${digest#sha256:} — the filename is the bare hex; merge globs these.
          digest='${{ steps.push.outputs.digest }}'
          [ -n "$digest" ] || { echo 'FAIL: build-push-action reported no digest'; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"
          echo "$digest for ${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag being baked
        id: oz
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then TAG=latest; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create the multi-arch manifests
        run: |
          set -eu
          U="${{ secrets.DOCKERHUB_USERNAME }}"
          T="${{ steps.oz.outputs.tag }}"
          SHA="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          SRC="docker.io/$U/openzoo-box"

          n=$(ls -1 /tmp/digests | wc -l)
          echo "digests collected: $n"
          [ "$n" -ge 2 ] || { echo "FAIL: expected 2 digests, got $n"; exit 1; }

          refs=""
          for f in /tmp/digests/*; do refs="$refs $SRC@sha256:$(basename "$f")"; done

          # openzoo-box first, from the raw per-arch digests.
          args="-t $SRC:latest -t $SRC:$SHA"
          if [ "$T" != "latest" ]; then args="$args -t $SRC:$T"; fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $args $refs

          # grokui is the same image under a second name. Copy the finished
          # manifest rather than re-stitching digests: same namespace, so this
          # is a manifest write, not a rebuild or a re-upload of layers.
          G="docker.io/$U/grokui"
          gargs="-t $G:latest -t $G:$SHA"
          if [ "$T" != "latest" ]; then gargs="$gargs -t $G:$T"; fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $gargs "$SRC:latest"

      - name: Verify both arches are in the manifest
        run: |
          set -eu
          U="${{ secrets.DOCKERHUB_USERNAME }}"
          for repo in openzoo-box grokui; do
            out=$(docker buildx imagetools inspect "docker.io/$U/$repo:latest")
            echo "--- $repo"; echo "$out"
            echo "$out" | grep -q 'linux/amd64' || { echo "FAIL: no amd64 in $repo manifest"; exit 1; }
            echo "$out" | grep -q 'linux/arm64' || { echo "FAIL: no arm64 in $repo manifest"; exit 1; }
          done
          echo 'OK: multi-arch manifests published'

      - name: Summary
        run: |
          U="${{ secrets.DOCKERHUB_USERNAME }}"
          {
            echo "### Pushed to Docker Hub (native GitHub runners, amd64 + arm64)"
            echo '```'
            echo "$U/openzoo-box:latest"
            echo "$U/grokui:latest"
            echo "  + :${{ steps.oz.outputs.tag }} and :sha-$(echo ${{ github.sha }} | cut -c1-7)"
            echo '```'
            echo "Built without Docker Build Cloud — minutes exhausted."
          } >> "$GITHUB_STEP_SUMMARY"
