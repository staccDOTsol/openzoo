# Build the openzoo box image and push it to Docker Hub.
#
# Triggers on any grokui-v* / v* tag, so cutting a release publishes the image
# with no further action. Also runnable by hand with an explicit tag to
# reproduce an older image.
#
# The image bakes grokui + openzoo + node_modules + a dev toolchain onto disk
# so a box never fetches from GitHub at boot: RunPod egress IPs get 429'd, and
# a 429 from raw.githubusercontent lands as a file whose CONTENTS are the text
# "429: Too Many Requests", which then fails like an app bug rather than a
# download bug.
#
# BUILT ON DOCKER BUILD CLOUD (jrsdunn123/cloud), which has native linux-amd64
# AND linux-arm64 machines plus a persistent shared cache. That replaces the
# previous shape — a two-runner matrix that pushed by digest and needed a
# separate merge job to stitch the manifest, because two runners cannot write
# the same tag without clobbering each other. One builder emits a proper
# multi-arch manifest directly, so the matrix, the digest artifacts and the
# merge job are all gone.
#
# History, so nobody reintroduces a slower shape: single-job QEMU emulation
# was ~7m30s, the native two-runner matrix ~2m50s.
name: docker-box

on:
  push:
    tags: ['grokui-v*', 'v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'openzoo tag to bake (blank = newest grokui-v*)'
        required: false
        default: ''

env:
  CLOUD_BUILDER: cloud          # the builder named "cloud" under the Hub namespace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag being baked
        id: oz
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then TAG=latest; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "baking $TAG"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # driver: cloud sends the build to Docker's remote native machines. No
      # setup-qemu-action — nothing is emulated, and that action was also the
      # flakiest step here (codeload 503'd on it three times in one incident,
      # failing the run before anything was built).
      - name: Use the cloud builder
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CLOUD_BUILDER }}
          install: true

      # amd64 only, --load'ed, so the gate can actually RUN the image. A
      # multi-arch result is a manifest and cannot be loaded into the local
      # docker. The cloud cache makes this nearly free for the push below.
      - name: Build (amd64, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: box.Dockerfile
          build-args: |
            OZ_TAG=${{ steps.oz.outputs.tag }}
            PROOFFRONT_URL=${{ vars.PROOFFRONT_URL }}
          platforms: linux/amd64
          load: true
          tags: openzoo-box:smoke

      # The gate. A 429 corpse, a missing bin, a musl base, a UI that does not
      # serve, or a missing dev toolchain fails HERE and nothing is published.
      - name: Smoke test
        run: |
          set -eu
          docker run --rm openzoo-box:smoke cat /etc/os-release | grep -qi debian \
            || { echo 'FAIL: base is not Debian'; exit 1; }
          docker run --rm openzoo-box:smoke test -f /opt/openzoo/bin/openzoo.js \
            || { echo 'FAIL: /opt/openzoo/bin/openzoo.js missing'; exit 1; }
          docker run --rm openzoo-box:smoke test -d /opt/openzoo/node_modules \
            || { echo 'FAIL: /opt/openzoo/node_modules missing'; exit 1; }
          docker run --rm openzoo-box:smoke sh -c 'head -c 3 /opt/grokui/grokui.mjs | grep -q 429' \
            && { echo 'FAIL: baked grokui.mjs is a 429 corpse'; exit 1; } || true
          # The dev toolchain is the point of the image; without it a bot hits
          # `python3: not found` and looks broken when the box is at fault.
          for b in bash gcc make python3 pip3 git jq rg; do
            docker run --rm openzoo-box:smoke sh -c "command -v $b >/dev/null" \
              || { echo "FAIL: $b missing from the image"; exit 1; }
          done
          echo "baked tag: $(docker run --rm openzoo-box:smoke cat /opt/openzoo/.oz-tag)"

          docker run --rm -d --name ozbox -p 4173:4173 -p 8402:8402 openzoo-box:smoke
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -o /tmp/g.html http://127.0.0.1:4173/; then ok=1; break; fi
            sleep 1
          done
          echo '--- container logs ---'; docker logs ozbox 2>&1 | tail -20
          [ "$ok" = 1 ] || { echo 'FAIL: grokui never served on :4173'; docker rm -f ozbox; exit 1; }
          if head -c 3 /tmp/g.html | grep -q 429; then echo 'FAIL: served a 429'; exit 1; fi
          grep -qi '<!doctype html' /tmp/g.html \
            || { echo 'FAIL: not HTML:'; head -c 200 /tmp/g.html; docker rm -f ozbox; exit 1; }
          echo "OK: $(wc -c < /tmp/g.html) bytes of grokui HTML"
          docker rm -f ozbox

      - name: Compute Hub tags
        id: meta
        run: |
          T="${{ steps.oz.outputs.tag }}"
          SHA="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          U="${{ secrets.DOCKERHUB_USERNAME }}"
          {
            echo "tags<<EOF"
            for repo in openzoo-box grokui; do
              echo "$U/$repo:latest"
              if [ "$T" != "latest" ]; then echo "$U/$repo:$T"; fi
              echo "$U/$repo:$SHA"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # One build, both arches, native, straight to a multi-arch manifest.
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: box.Dockerfile
          build-args: |
            OZ_TAG=${{ steps.oz.outputs.tag }}
            PROOFFRONT_URL=${{ vars.PROOFFRONT_URL }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Verify both arches are in the manifest
        run: |
          set -eu
          U="${{ secrets.DOCKERHUB_USERNAME }}"
          out=$(docker buildx imagetools inspect "docker.io/$U/grokui:latest")
          echo "$out"
          echo "$out" | grep -q 'linux/amd64' || { echo 'FAIL: no amd64 in manifest'; exit 1; }
          echo "$out" | grep -q 'linux/arm64' || { echo 'FAIL: no arm64 in manifest'; exit 1; }
          echo 'OK: multi-arch manifest published'

      - name: Summary
        run: |
          U="${{ secrets.DOCKERHUB_USERNAME }}"
          {
            echo "### Pushed to Docker Hub (Docker Build Cloud, native amd64 + arm64)"
            echo '```'
            echo "$U/openzoo-box:latest"
            echo "$U/grokui:latest"
            echo "  + :${{ steps.oz.outputs.tag }} and :sha-$(echo ${{ github.sha }} | cut -c1-7)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
