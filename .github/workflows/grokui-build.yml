name: grokui multiarch build

# Real multiarch installers, built NATIVELY per OS — cross-compiling Windows/
# Linux installers from a single macOS box (no Docker/wine) isn't reliable,
# so each platform gets its own runner via electron-builder.
on:
  push:
    tags: ["grokui-v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is NOT built here — it is built, signed and notarized on the
          # maintainer's own Mac with scripts/release-mac.sh --publish, which
          # attaches the DMGs to this release afterwards. The signing cert and
          # its password live in ~/openzoo-signing; CI keeps MAC_CERT_P12 etc.
          # as secrets only so this can be reverted by re-adding the entry.
          - os: windows-latest
            script: dist:win
            artifact: win-installer
            glob: grokui-app/dist/*.exe
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux-appimage
            glob: grokui-app/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: grokui-app
        run: npm install
      # Real Developer ID signing + notarization when the secrets exist, and a
      # clean ad-hoc fallback when they don't (see build/afterPack.js). Without
      # notarization macOS shows "Apple could not verify openzoo is free of
      # malware" on first launch; with it, the app just opens.
      #
      # Requires, as repo secrets:
      #   MAC_CERT_P12       base64 of a DEVELOPER ID APPLICATION .p12 export
      #                      (NOT "Development" or "Distribution Managed" —
      #                      those are for Xcode/App Store and cannot notarize
      #                      a directly-distributed DMG)
      #   MAC_CERT_PASSWORD  the .p12 export password
      #   APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_API_KEY_P8
      #                      App Store Connect API key used to notarize
      #   APPLE_TEAM_ID      e.g. 38DS45YWYM
      # Notarization takes EITHER an App Store Connect API key (.p8 + key id +
      # issuer) OR an Apple ID with an app-specific password. Enable it only
      # when one of those actually exists — electron-builder's default is a
      # hard failure when `notarize` is on and the options can't be built, and
      # a fork with no Apple account must still get a working (ad-hoc) build.
      # DORMANT: no macos-latest entry is in the matrix any more, so this never
      # runs. Kept deliberately — re-adding that one matrix entry restores the
      # full macOS CI build with signing and notarization, and the secrets it
      # reads are still set. Delete both together or neither.
      - name: Enable notarization (macOS, only when credentials exist)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p ~/private_keys
            echo "$APPLE_API_KEY_P8" | base64 --decode > ~/private_keys/AuthKey.p8
            echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
            echo "notarize=api-key"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "notarize=apple-id"
          else
            echo "notarize=off (no credentials); ad-hoc signature only"
            exit 0
          fi
          node -e "
            const fs=require('fs'), f='grokui-app/package.json';
            const p=JSON.parse(fs.readFileSync(f,'utf8'));
            // electron-builder 25 wants a BOOLEAN here and reads the team from
            // the APPLE_TEAM_ID env var; passing {teamId} makes it warn
            // 'Please specify notarization Team ID in the APPLE_TEAM_ID env
            // var instead of notarize.teamId' and ignore the field.
            p.build.mac.notarize=true;
            fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n');
            console.log('notarize enabled for team', process.env.APPLE_TEAM_ID);
          "
        continue-on-error: false

      - name: Build (${{ matrix.script }})
        working-directory: grokui-app
        env:
          # electron-builder picks these up automatically. When CSC_LINK is
          # empty it skips real signing and afterPack's ad-hoc signature stands,
          # so unconfigured forks still produce a working (if unnotarized) app.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        # macOS runners default to a 256-descriptor limit, and codesign --deep
        # over the packaged dependency tree blows straight through it:
        #   EMFILE: too many open files ... viem/_esm/chains/definitions/tac.js
        shell: bash
        run: |
          ulimit -n 65535 2>/dev/null || ulimit -n unlimited 2>/dev/null || true
          echo "open-file limit: $(ulimit -n)"
          npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: openzoo-grokui-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # Publish the installers as a GitHub Release.
  #
  # This job exists because it DIDN'T, and cutting releases by hand meant
  # v1.5.1 and v1.5.2 both built green and then shipped to nobody — the tag,
  # the artifacts and the notarized DMG all existed, and users still saw
  # v1.5.0 on the releases page. A build that isn't published is invisible.
  #
  # `needs: build` with the default fail-fast behaviour means one broken
  # platform blocks the release, which is correct: a release missing Windows
  # is worse than a release that is late.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/grokui-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # No *.dmg here on purpose — macOS ships from the maintainer's Mac.
      - name: Verify every CI platform is present
        run: |
          set -eu
          ls -lh artifacts/
          for pat in '*.exe' '*.AppImage'; do
            # shellcheck disable=SC2086
            count=$(find artifacts -name "$pat" | wc -l)
            [ "$count" -gt 0 ] || { echo "FAIL: no $pat — refusing to publish a partial release"; exit 1; }
          done

      # RETRY THE PUBLISH. github.com 503s intermittently — it took out this
      # exact step once already, and the old `create || upload` fallback made
      # it worse: it assumed a failed create meant "already exists", so a 503
      # became "release not found" and the job died with every installer built
      # and nothing published. Distinguish "already exists" from "GitHub is
      # having a moment", and only the former should fall through to upload.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          TAG="${GITHUB_REF#refs/tags/}"
          TITLE="openzoo grokui ${TAG#grokui-}"

          publish() {
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --generate-notes artifacts/* 2>/tmp/err
          }

          for attempt in 1 2 3 4 5 6; do
            if publish; then echo "published on attempt $attempt"; exit 0; fi
            err="$(cat /tmp/err)"
            echo "attempt $attempt failed: $err"

            # Already there (e.g. a re-run): just attach the assets.
            if echo "$err" | grep -qi 'already exists'; then
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
              echo "release existed; assets uploaded"
              exit 0
            fi
            # Anything else is treated as transient and retried with backoff.
            sleep $((attempt * 20))
          done

          echo "FAILED: could not publish $TAG after 6 attempts"
          echo "Installers ARE built and attached to this run as artifacts."
          exit 1

      # macOS is not in CI, so a release is INCOMPLETE until the local script
      # runs. Say so on the release itself and in the run summary — the whole
      # point of moving mac local is speed, and the cost of that speed is a
      # manual step, which is exactly the kind of thing that gets forgotten.
      # A release that quietly lacks macOS is the failure mode to avoid.
      - name: Flag that macOS is still pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
               -q '.assets[].name' 2>/dev/null | grep -q '\.dmg$'; then
            echo "macOS assets already attached."
            exit 0
          fi
          NOTE='> **macOS installers are not attached yet.** They are built, signed and notarized on the maintainer'"'"'s Mac and uploaded separately — run `./scripts/release-mac.sh --publish`.'
          BODY="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTE"$'\n\n'"$BODY" || true
          {
            echo "### ⚠️ macOS still pending for $TAG"
            echo ''
            echo 'Windows and Linux are attached. To finish the release:'
            echo '```bash'
            echo 'cd openzoo-shim && ./scripts/release-mac.sh --publish'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
