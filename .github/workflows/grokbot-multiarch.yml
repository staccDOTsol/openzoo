name: grokbot-multiarch

# Downloads the official Grok Bot (vendor "sand") builds for all six
# platform/arch combos, verifies + renames them Grok_Bot_<version>_<plat>-<arch>,
# and publishes them to a GitHub release tagged grokbot-v<version>.
on:
  push:
    tags: ['grokbot-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install zip tooling
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Download, verify, publish Grok Bot multiarch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-grokbot.sh
