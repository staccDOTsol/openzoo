name: OpenZoo Launcher installers
on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: windows-2025, platform: win, arch: x64 }
          - { os: windows-11-arm, platform: win, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Bound macOS signing file probes
        if: matrix.platform == 'mac'
        run: node patch-signing.cjs
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        run: npm version "${GITHUB_REF#refs/tags/launcher-v}" --no-git-tag-version --allow-same-version
      - name: Bundle latest Node LTS and OpenZoo
        run: npm run prepare:bundle
      - name: Enable notarization when configured
        if: matrix.platform == 'mac'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e 'const fs=require("fs"); const p=require("./package.json"); if(process.env.APPLE_ID && process.env.APPLE_APP_SPECIFIC_PASSWORD && process.env.APPLE_TEAM_ID) p.build.mac.notarize=true; fs.writeFileSync("package.json",JSON.stringify(p,null,2));'
      - name: Build installer
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ '${{ matrix.platform }}' != mac ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          ulimit -n 65535 2>/dev/null || ulimit -n unlimited 2>/dev/null || true
          npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Checksums
        run: |
          node -e 'const fs=require("fs"),crypto=require("crypto"); const files=fs.readdirSync("dist").filter(f=>/\.(dmg|exe|AppImage)$/.test(f)); if(!files.length) throw Error("No installer"); fs.writeFileSync("dist/SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt",files.map(f=>crypto.createHash("sha256").update(fs.readFileSync("dist/"+f)).digest("hex")+"  "+f).join("\n")+"\n");'
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            launcher/dist/*.dmg
            launcher/dist/*.exe
            launcher/dist/*.AppImage
            launcher/dist/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Publish successful platform
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "OpenZoo Launcher ${TAG#launcher-v}" --notes 'Install OpenZoo Launcher, then launch ChatGPT. Includes a first-run funding walkthrough and a Deposit button in the savings overlay. Includes Node and npm; checks for the latest OpenZoo at launch with a bundled fallback. Downloads the chat app when missing. Each available platform is uploaded independently. Windows installers are unsigned.' || gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
          shopt -s nullglob
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.dmg dist/*.exe dist/*.AppImage dist/SHA256SUMS-*.txt
