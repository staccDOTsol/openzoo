# PUBLISH openzoo TO npm FROM CI, SO NOBODY TYPES AN OTP AGAIN.
#
# Every push to main runs a cheap check: is package.json's version already on
# the registry? If yes, nothing happens. If no, it publishes exactly that
# commit. So a release is "bump the version on main" and nothing else — no
# local login, no one-time code, no forgetting.
#
# Auth, in order of preference:
#   1. npm TRUSTED PUBLISHING (OIDC). No secret anywhere. One-time setup on
#      npmjs.com → package openzoo → Settings → Trusted Publisher → GitHub
#      Actions: owner staccDOTsol, repo openzoo, workflow npm-publish.yml.
#      Needs npm ≥ 11.5.1 on the runner, hence the npm upgrade step, and
#      `id-token: write` below. Publishes with provenance for free.
#   2. An NPM_TOKEN repo secret (granular token, "bypass 2FA" on). If it is
#      set it is used; if it is empty the step falls through to OIDC.
#
# The test suite is NOT a gate here on purpose: it carries a known
# environmental failure (multimodal) that would block every release, and the
# tests that matter ran on the commit before it was merged. Add a gate when
# the suite is green in CI.
name: npm publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm new enough for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Is this version already on the registry?
        id: check
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on the registry — publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # TRUSTED PUBLISHING FIRST, THE TOKEN ONLY AS A FALLBACK.
      #
      # Run 4 (2026-09-09) failed with ENEEDAUTH: the NPM_TOKEN secret exists
      # but the registry no longer accepts it (npm is retiring tokens that
      # bypass 2FA), and because setup-node had already written it into
      # .npmrc, npm used the dead token instead of the OIDC identity this job
      # carries. So: publish with NO token first — that is trusted publishing,
      # which works the moment the package trusts this workflow on npmjs.com —
      # and only if that fails try the secret, for the interim before that
      # one-time setup is done.
      - name: Publish (trusted publishing, no token)
        id: oidc
        if: steps.check.outputs.publish == 'true'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --access public --provenance

      - name: Publish (NPM_TOKEN fallback)
        id: token
        if: steps.check.outputs.publish == 'true' && steps.oidc.outcome != 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::trusted publishing failed and no NPM_TOKEN secret is set. One-time fix: npmjs.com → package openzoo → Settings → Trusted Publisher → GitHub Actions: owner staccDOTsol, repo openzoo, workflow npm-publish.yml. Or add a granular NPM_TOKEN secret with 2FA bypass."
            exit 1
          fi
          npm publish --access public --provenance

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.publish }}" = "true" ] && { [ "${{ steps.oidc.outcome }}" = "success" ] || [ "${{ steps.token.outcome }}" = "success" ]; }; then
            echo "published openzoo@${{ steps.check.outputs.version }} (${{ steps.oidc.outcome == 'success' && 'trusted publishing' || 'NPM_TOKEN' }})" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.check.outputs.publish }}" = "true" ]; then
            echo "FAILED to publish openzoo@${{ steps.check.outputs.version }} — see the publish steps" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "openzoo@${{ steps.check.outputs.version }} already published, skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
