<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>openzoo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #bootSplash {
      position: fixed; inset: 0; z-index: 4000; background: #000; color: #6f7080;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      letter-spacing: .06em; -webkit-app-region: drag;
    }
    .bootmark { display: flex; gap: 6px; }
    .bootmark span {
      width: 6px; height: 6px; border-radius: 50%; background: #ececec;
      opacity: .22; animation: bootdot 1.2s infinite ease-in-out;
    }
    .bootmark span:nth-child(2) { animation-delay: .15s; }
    .bootmark span:nth-child(3) { animation-delay: .3s; }
    @keyframes bootdot { 0%, 80%, 100% { opacity: .18; } 40% { opacity: 1; } }
    #bootStatus { color: #6f7080; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) {
      .bootmark span { animation: none; opacity: .5; }
    }
  </style>
</head>
<body>
  <div id="bootSplash" role="status" aria-live="polite">
    <div class="bootmark" aria-hidden="true"><span></span><span></span><span></span></div>
    <div id="bootStatus">starting…</div>
  </div>
  <script>
    window.setBootStatus = function (msg) {
      var el = document.getElementById('bootStatus');
      if (el && msg) el.textContent = msg;
    };
  </script>
</body>
</html>
